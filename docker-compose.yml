# ==============================================================
# DUROZEN Creative Portfolio - Docker Compose Architecture
# Ready for Dokploy & Multi-stage Container Deployment
# ==============================================================

services:
  # ------------------------------------------------------------
  # PostgreSQL Database Service (Internal Network Only)
  # ------------------------------------------------------------
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-durozen_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - durozen_pgdata:/var/lib/postgresql/data
    networks:
      - durozen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-durozen_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ------------------------------------------------------------
  # FastAPI Backend Service (Internal Network Only)
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-durozen_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PORT: 8000
    expose:
      - "8000"
    volumes:
      - durozen_uploads:/app/uploads
      - durozen_screenshots:/public/screenshots
    networks:
      - durozen-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------
  # Next.js Frontend Service (Connect Dokploy Domain to Port 3000)
  # ------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        BACKEND_URL: ${DOCKER_BACKEND_URL:-http://backend:8000}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: ${DOCKER_BACKEND_URL:-http://backend:8000}
    expose:
      - "3000"
    networks:
      - durozen-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# --------------------------------------------------------------
# Persistent Storage Volumes
# --------------------------------------------------------------
volumes:
  durozen_pgdata:
  durozen_uploads:
  durozen_screenshots:

# --------------------------------------------------------------
# Isolated Bridge Network
# --------------------------------------------------------------
networks:
  durozen-network:
    driver: bridge
