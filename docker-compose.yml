# ==============================================================
# DUROZEN Creative Portfolio - Docker Compose Architecture
# Ready for Dokploy & Multi-stage Container Deployment
# ==============================================================

services:
  # ------------------------------------------------------------
  # PostgreSQL Database Service (Internal Network Only)
  # ------------------------------------------------------------
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-durozen_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-durozen_secret_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - durozen_pgdata:/var/lib/postgresql/data
    networks:
      - durozen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-durozen_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ------------------------------------------------------------
  # FastAPI Backend Service (Internal Network Only)
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-durozen_secret_password_2026}@db:5432/${POSTGRES_DB:-durozen_db}
      SECRET_KEY: ${SECRET_KEY:-d911b8c16bafc949ce978b660ac4252f3fb2c1bd3c6d4cb9be7066da551a7407}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://portfolio.durozen.in,http://portfolio.durozen.in,http://localhost:3000,http://127.0.0.1:3000}
      PORT: 8000
    expose:
      - "8000"
    volumes:
      - durozen_uploads:/app/uploads
      - durozen_screenshots:/public/screenshots
    networks:
      - durozen-network
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------
  # Next.js Frontend Service (Dokploy Web Service)
  # ------------------------------------------------------------
  web:
    image: ${WEB_IMAGE:-durozen-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    links:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      DOCKER_BACKEND_URL: http://backend:8000
      DOCKER_CONTAINER: "true"
    # Do NOT use "ports:" here
    # Optional: "expose:" only documents the port internally for other containers
    expose:
      - 3000
    networks:
      durozen-network:
        aliases:
          - frontend
      dokploy-network:
        aliases:
          - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# --------------------------------------------------------------
# Persistent Storage Volumes
# --------------------------------------------------------------
volumes:
  durozen_pgdata:
  durozen_uploads:
  durozen_screenshots:

# --------------------------------------------------------------
# Networks
# --------------------------------------------------------------
networks:
  durozen-network:
    driver: bridge
  dokploy-network:
    external: true
